name: Build macOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: geode-sdk/build-geode-mod@main
        with:
          cli: latest
          sdk: 5.10.1

      - uses: actions/upload-artifact@v4
        with:
          name: icon-maker-macos
          path: build/*.geode
          if-no-files-found: error
